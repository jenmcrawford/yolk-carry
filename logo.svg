<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="680" height="470" role="img">
  <title>Cartoon fried egg wearing sunglasses and carrying a strongman yoke</title>
  <desc>A grinning egg yolk in dark sunglasses sits at the centre of a wavy spread of egg white that forms its body, with stubby legs below and arms reaching up and back to grip a steel yoke bar loaded with red weight plates.</desc>

  <!-- ground shadow -->
  <ellipse cx="340" cy="432" rx="150" ry="15" fill="#3A2F26" opacity="0.13"/>

  <!-- yoke posts and plates (behind the character) -->
  <rect x="176" y="226" width="20" height="112" rx="6" fill="#6E7A87" stroke="#3A2F26" stroke-width="4"/>
  <rect x="484" y="226" width="20" height="112" rx="6" fill="#6E7A87" stroke="#3A2F26" stroke-width="4"/>
  <circle cx="186" cy="340" r="52" fill="#C1503A" stroke="#3A2F26" stroke-width="5"/>
  <circle cx="186" cy="340" r="22" fill="#8E3A28" stroke="#3A2F26" stroke-width="4"/>
  <circle cx="494" cy="340" r="52" fill="#C1503A" stroke="#3A2F26" stroke-width="5"/>
  <circle cx="494" cy="340" r="22" fill="#8E3A28" stroke="#3A2F26" stroke-width="4"/>

  <!-- yoke crossbar -->
  <rect x="166" y="202" width="348" height="24" rx="10" fill="#7F8B98" stroke="#3A2F26" stroke-width="5"/>
  <rect x="178" y="208" width="324" height="6" rx="3" fill="#AEBAC5" opacity="0.6"/>

  <!-- legs -->
  <path d="M318 380 L318 408" stroke="#3A2F26" stroke-width="14" stroke-linecap="round"/>
  <path d="M362 380 L362 408" stroke="#3A2F26" stroke-width="14" stroke-linecap="round"/>

  <!-- egg white body -->
  <path d="M222 306 C220 272 244 250 272 256 C282 230 314 218 340 230 C366 218 398 230 408 256 C436 250 460 272 458 306 C460 340 436 362 408 356 C398 382 366 394 340 382 C314 394 282 382 272 356 C244 362 220 340 222 306 Z" fill="#FDF8EE" stroke="#3A2F26" stroke-width="5"/>
  <path d="M250 292 C252 272 266 260 282 260" fill="none" stroke="#EADFC8" stroke-width="7" stroke-linecap="round"/>
  <path d="M398 356 C418 354 432 342 434 326" fill="none" stroke="#EADFC8" stroke-width="7" stroke-linecap="round"/>

  <!-- yolk -->
  <circle cx="340" cy="306" r="64" fill="#F2A93B" stroke="#3A2F26" stroke-width="5"/>
  <ellipse cx="310" cy="272" rx="16" ry="9" fill="#F9C765" opacity="0.9" transform="rotate(-30 310 272)"/>

  <!-- arms and hands gripping the bar -->
  <path d="M268 282 C250 268 240 246 238 228" fill="none" stroke="#3A2F26" stroke-width="13" stroke-linecap="round"/>
  <path d="M412 282 C430 268 440 246 442 228" fill="none" stroke="#3A2F26" stroke-width="13" stroke-linecap="round"/>
  <ellipse cx="234" cy="216" rx="20" ry="18" fill="#F2E2C6" stroke="#3A2F26" stroke-width="4"/>
  <ellipse cx="446" cy="216" rx="20" ry="18" fill="#F2E2C6" stroke="#3A2F26" stroke-width="4"/>

  <!-- sunglasses -->
  <path d="M282 288 L398 288" stroke="#2B2B2B" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="314" cy="296" rx="25" ry="18" fill="#2B2B2B" stroke="#1A1A1A" stroke-width="3"/>
  <ellipse cx="366" cy="296" rx="25" ry="18" fill="#2B2B2B" stroke="#1A1A1A" stroke-width="3"/>
  <path d="M340 290 L340 300" stroke="#2B2B2B" stroke-width="8" stroke-linecap="round"/>
  <path d="M300 288 L312 300" stroke="#7E8896" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <path d="M352 288 L364 300" stroke="#7E8896" stroke-width="5" stroke-linecap="round" opacity="0.85"/>

  <!-- grin -->
  <path d="M310 328 C326 350 354 350 370 328 C354 322 326 322 310 328 Z" fill="#3A2F26"/>
  <path d="M316 329 C332 324 348 324 364 329" fill="none" stroke="#FDF8EE" stroke-width="5" stroke-linecap="round"/>
  <path d="M332 342 C338 350 346 350 352 342 C346 338 338 338 332 342 Z" fill="#E58A72"/>
  <ellipse cx="291" cy="330" rx="13" ry="8" fill="#E07A5F" opacity="0.45"/>
  <ellipse cx="389" cy="330" rx="13" ry="8" fill="#E07A5F" opacity="0.45"/>

  <!-- feet -->
  <ellipse cx="311" cy="412" rx="25" ry="11" fill="#E8B04B" stroke="#3A2F26" stroke-width="4"/>
  <ellipse cx="369" cy="412" rx="25" ry="11" fill="#E8B04B" stroke="#3A2F26" stroke-width="4"/>

  <!-- shell fragments -->
  <path d="M232 426 L238 412 L245 421 L253 409 L261 420 L268 413 L272 426 Z" fill="#F9EEDA" stroke="#3A2F26" stroke-width="4" stroke-linejoin="round"/>
  <path d="M408 426 L413 411 L421 420 L429 408 L437 419 L444 412 L448 426 Z" fill="#F9EEDA" stroke="#3A2F26" stroke-width="4" stroke-linejoin="round"/>
</svg>
