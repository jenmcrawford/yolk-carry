[project]
name = "yolk-carry"
version = "0.1.0"
description = "Inventory-aware meal planning that keeps you on framework"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
yolk = "yolk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yolk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
